<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Autorización TikTok — NANWES Social Hub</title>
<style>body{margin:0;background:#f5f1fb;color:#251533;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:18px}main{background:white;border-radius:16px;padding:32px;max-width:580px;width:100%;box-shadow:0 15px 40px #35104b1c}h1{margin:0 0 12px}p{line-height:1.6;color:#55495f}small{color:#766b7b}</style>
</head><body>
<main><h1>Conexión de TikTok</h1><p id="status">Comprobando autorización…</p><small>No escribas contraseñas ni tokens en esta página.</small></main>
<script>
(async function(){
  const status=document.getElementById('status');
  const p=new URLSearchParams(location.search);
  const state=p.get('state')||'',code=p.get('code')||'',error=p.get('error')||'';
  history.replaceState(null,document.title,location.pathname);
  if(!state || (!code && !error)){status.textContent='No se recibió una autorización de TikTok. Regresa al panel NANWES Social Hub.';return;}
  let url='';
  try {
    const response=await fetch('./config.json',{cache:'no-store'});
    if(!response.ok)throw new Error('La configuración no está disponible');
    const config=await response.json();url=String(config.webapp_url||'');
  }catch(err){status.textContent='La conexión a Apps Script está pendiente de configurar. Regresa al panel NANWES Social Hub.';return;}
  if(!/^https:\/\/script\.google\.com\/(?:macros\/s\/|a\/[^/]+\/macros\/s\/|a\/macros\/[^/]+\/s\/)[A-Za-z0-9_-]+\/exec$/.test(url)){
    status.textContent='No se ha configurado todavía una dirección válida de Apps Script.';return;
  }
  status.textContent='TikTok autorizó el retorno. Finalizando de manera segura en Apps Script…';
  const form=document.createElement('form');form.method='POST';form.action=url;form.style.display='none';
  for(const [name,value] of Object.entries({tiktok_oauth:'1',state,code,error})){
    const input=document.createElement('input');input.type='hidden';input.name=name;input.value=value;form.append(input);
  }
  document.body.append(form);form.submit();
})();
</script>
</body></html>
